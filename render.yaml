# render.yaml — deploy both frontend and backend to Render.com with one file

services:
  # ── FastAPI Backend ───────────────────────────────────────────────────────
  - type: web
    name: snti-hostel-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: snti-hostel-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true   # Render auto-generates a secure random key
      - key: FRONTEND_URL
        value: https://snti-hostel.onrender.com   # update after deploy

  # ── React Frontend ────────────────────────────────────────────────────────
  - type: web
    name: snti-hostel
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# ── PostgreSQL Database ───────────────────────────────────────────────────────
databases:
  - name: snti-hostel-db
    databaseName: snti_hostel
    plan: free
